name: Validate public skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Validate bundled notebook template
        run: >-
          node error-notebook/scripts/validate-notebook.mjs
          --notebook error-notebook/references/error-notebook.md
      - name: Check public repository privacy boundary
        run: node error-notebook/scripts/validate-public-repo.mjs
      - name: Verify Skills CLI installation and first-run initialization
        env:
          ERROR_NOTEBOOK_PATH: ${{ runner.temp }}/npx-data/error-notebook.md
          DISABLE_TELEMETRY: "1"
        run: |
          npx --yes skills add "${{ github.workspace }}" --skill error-notebook --agent codex claude-code cursor --global --yes --copy
          node -e "const {spawnSync}=require('node:child_process');const os=require('node:os');const path=require('node:path');const script=path.join(os.homedir(),'.agents','skills','error-notebook','scripts','search-notebook.mjs');const result=spawnSync(process.execPath,[script,'npx skills'],{stdio:'inherit',env:process.env});process.exit(result.status??1)"
          node -e "const fs=require('node:fs');if(!fs.existsSync(process.env.ERROR_NOTEBOOK_PATH)){console.error('Private notebook was not initialized');process.exit(1)}"
      - name: Verify cross-platform installer
        run: >-
          node error-notebook/scripts/install-skill.mjs
          --install-path "${{ runner.temp }}/agent-skills/skills/error-notebook"
          --backup-root "${{ runner.temp }}/agent-skills/skill-backups"
          --private-notebook "${{ runner.temp }}/link-data/error-notebook.md"
      - name: Verify installer idempotency
        run: >-
          node error-notebook/scripts/install-skill.mjs
          --install-path "${{ runner.temp }}/agent-skills/skills/error-notebook"
          --backup-root "${{ runner.temp }}/agent-skills/skill-backups"
          --private-notebook "${{ runner.temp }}/link-data/error-notebook.md"
