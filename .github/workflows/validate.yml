name: Validate public skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Validate bundled notebook template
        run: >-
          node error-notebook/scripts/validate-notebook.mjs
          --notebook error-notebook/references/error-notebook.md
      - name: Check public repository privacy boundary
        run: node error-notebook/scripts/validate-public-repo.mjs
      - name: Verify cross-platform installer
        run: >-
          node error-notebook/scripts/install-skill.mjs
          --install-path "${{ runner.temp }}/codex/skills/error-notebook"
          --backup-root "${{ runner.temp }}/codex/skill-backups"
          --private-notebook "${{ runner.temp }}/codex/error-notebook-data/error-notebook.md"
      - name: Verify installer idempotency
        run: >-
          node error-notebook/scripts/install-skill.mjs
          --install-path "${{ runner.temp }}/codex/skills/error-notebook"
          --backup-root "${{ runner.temp }}/codex/skill-backups"
          --private-notebook "${{ runner.temp }}/codex/error-notebook-data/error-notebook.md"
